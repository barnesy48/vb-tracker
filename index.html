<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="VB Tracker" />
  <title>VB Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1e0a3c; }
    body { -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    input::placeholder { color: rgba(255,255,255,0.25); }
    input:focus { outline: none; }
    button { cursor: pointer; }
    #root { min-height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script>
  (function() {
    'use strict';
    const { useState, useEffect } = React;

    // ── Constants ──────────────────────────────────────────────────────────────
    const POS_COLOR = "#4ade80";
    const ERR_COLOR = "#f87171";
    const POSITIVES = [
      { key: "kills",  label: "Kill",  icon: "Kill", color: POS_COLOR },
      { key: "aces",   label: "Ace",   icon: "Ace",  color: POS_COLOR },
      { key: "digs",   label: "Dig",   icon: "Dig",  color: POS_COLOR },
    ];
    const ERRORS = [
      { key: "serve",    label: "Serve", icon: "Srv", color: ERR_COLOR },
      { key: "hit",      label: "Hit",   icon: "Hit", color: ERR_COLOR },
      { key: "pass",     label: "Pass",  icon: "Pas", color: ERR_COLOR },
      { key: "position", label: "Pos",   icon: "Pos", color: ERR_COLOR },
    ];
    const ALL_STATS = [...POSITIVES, ...ERRORS];
    const PLAYER_GRADIENTS = [
      "linear-gradient(135deg,#c084fc,#818cf8)",
      "linear-gradient(135deg,#38bdf8,#6366f1)",
      "linear-gradient(135deg,#4ade80,#06b6d4)",
      "linear-gradient(135deg,#facc15,#f97316)",
      "linear-gradient(135deg,#f472b6,#c084fc)",
      "linear-gradient(135deg,#fb923c,#f87171)",
      "linear-gradient(135deg,#a78bfa,#38bdf8)",
      "linear-gradient(135deg,#4ade80,#a78bfa)",
      "linear-gradient(135deg,#facc15,#4ade80)",
      "linear-gradient(135deg,#f87171,#f472b6)",
      "linear-gradient(135deg,#38bdf8,#facc15)",
      "linear-gradient(135deg,#c084fc,#f472b6)",
    ];
    const ACCENT = "#c084fc";
    const GREEN  = "#4ade80";
    const BG     = "linear-gradient(160deg,#1e0a3c 0%,#0f172a 50%,#1a0e2e 100%)";
    const SETS   = [1, 2, 3, 4, 5];

    const emptyPos     = () => ({ kills: 0, aces: 0, digs: 0 });
    const emptyErr     = () => ({ serve: 0, hit: 0, pass: 0, position: 0 });
    const emptySetStat = () => ({ 1: { pos: emptyPos(), err: emptyErr() }, 2: { pos: emptyPos(), err: emptyErr() }, 3: { pos: emptyPos(), err: emptyErr() }, 4: { pos: emptyPos(), err: emptyErr() }, 5: { pos: emptyPos(), err: emptyErr() } });

    const sumPos   = (p) => POSITIVES.reduce((s, t) => s + ((p && p[t.key]) || 0), 0);
    const sumErr   = (e) => ERRORS.reduce((s, t) => s + ((e && e[t.key]) || 0), 0);
    const netScore = (pos, err) => sumPos(pos) - sumErr(err);

    const sumSetPos = (sets) => {
      const r = emptyPos();
      SETS.forEach(n => POSITIVES.forEach(t => { r[t.key] += (sets && sets[n] && sets[n].pos && sets[n].pos[t.key]) || 0; }));
      return r;
    };
    const sumSetErr = (sets) => {
      const r = emptyErr();
      SETS.forEach(n => ERRORS.forEach(t => { r[t.key] += (sets && sets[n] && sets[n].err && sets[n].err[t.key]) || 0; }));
      return r;
    };

    // ── Storage ────────────────────────────────────────────────────────────────
    const load    = (k) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } };
    const persist = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    // ── Sparkline ──────────────────────────────────────────────────────────────
    function Sparkline({ values, color, h, w }) {
      color = color || "#e63946"; h = h || 22; w = w || 72;
      if (!values || values.length < 2) return null;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;
      const pts = values.map((v, i) => {
        const x = (i / (values.length - 1)) * w;
        const y = h - ((v - min) / range) * (h - 6) - 3;
        return x + "," + y;
      }).join(" ");
      return React.createElement("svg", { width: w, height: h, style: { display: "block", flexShrink: 0 } },
        React.createElement("polyline", { points: pts, fill: "none", stroke: color, strokeWidth: "1.8", strokeLinejoin: "round", strokeLinecap: "round" }),
        ...values.map((v, i) => {
          const x = (i / (values.length - 1)) * w;
          const y = h - ((v - min) / range) * (h - 6) - 3;
          return React.createElement("circle", { key: i, cx: x, cy: y, r: "2.5", fill: color });
        })
      );
    }

    // ── Atoms ──────────────────────────────────────────────────────────────────
    function Tile({ icon, value, label, color, sub }) {
      return React.createElement("div", {
        style: { flex: "1 1 52px", background: color + "18", border: "1px solid " + color + "44", borderRadius: 10, padding: "8px 4px", textAlign: "center" }
      },
        React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, color, lineHeight: 1.1 } }, value),
        React.createElement("div", { style: { fontSize: 9, color: color, marginTop: 1, fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 0.5 } }, label),
        sub != null ? React.createElement("div", { style: { fontSize: 8, color: "rgba(255,255,255,0.22)" } }, sub) : null
      );
    }

    function SL({ children }) {
      return React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 11, letterSpacing: 2, color: "rgba(255,255,255,0.3)", marginBottom: 7 } }, children);
    }

    function Empty({ text, sub }) {
      return React.createElement("div", { style: { textAlign: "center", padding: "56px 20px" } },
        React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 18, letterSpacing: 2, color: "rgba(255,255,255,0.18)" } }, text),
        sub ? React.createElement("div", { style: { fontSize: 11, color: "rgba(255,255,255,0.12)", marginTop: 6 } }, sub) : null
      );
    }

    function NetBadge({ pos, err }) {
      const net = netScore(pos, err);
      const color = net > 0 ? GREEN : net < 0 ? "#f87171" : "rgba(255,255,255,0.3)";
      const label = net > 0 ? "+" + net : "" + net;
      return React.createElement("span", {
        style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 14, color, background: color + "22", border: "1px solid " + color + "55", borderRadius: 6, padding: "1px 7px" }
      }, label);
    }

    // ── Confirm modal ──────────────────────────────────────────────────────────
    function ConfirmModal({ modal, onConfirm, onCancel }) {
      if (!modal) return null;
      return React.createElement("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.78)", zIndex: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 } },
        React.createElement("div", { style: { background: "#2d1060", border: "1px solid rgba(192,132,252,0.3)", borderRadius: 16, padding: 26, width: "100%", maxWidth: 320, textAlign: "center" } },
          React.createElement("div", { style: { fontSize: 26, marginBottom: 12 } }, "⚠️"),
          React.createElement("div", { style: { fontSize: 14, color: "rgba(255,255,255,0.85)", lineHeight: 1.5, marginBottom: 20 } }, modal.message),
          React.createElement("div", { style: { display: "flex", gap: 10 } },
            React.createElement("button", { onClick: onCancel, style: { flex: 1, background: "transparent", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 9, color: "rgba(255,255,255,0.6)", fontSize: 13, padding: 10, fontFamily: "'DM Sans',sans-serif", fontWeight: 700 } }, "Cancel"),
            React.createElement("button", { onClick: onConfirm, style: { flex: 1, background: "#f87171", border: "none", borderRadius: 9, color: "#fff", fontSize: 13, fontWeight: 700, padding: 10, fontFamily: "'DM Sans',sans-serif" } }, "Confirm")
          )
        )
      );
    }

    // ── Save modal ─────────────────────────────────────────────────────────────
    function SaveModal({ open, gamesCount, setsPlayed, setSetsPlayed, gameLabel, setGameLabel, gameDate, setGameDate, onSave, onClose }) {
      if (!open) return null;
      return React.createElement("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.72)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }, onClick: onClose },
        React.createElement("div", { style: { background: "#2d1060", border: "1px solid rgba(192,132,252,0.3)", borderRadius: 16, padding: 26, width: "100%", maxWidth: 360 }, onClick: e => e.stopPropagation() },
          React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, letterSpacing: 2, marginBottom: 6, color: ACCENT } }, "SAVE GAME TO SEASON"),
          React.createElement("div", { style: { fontSize: 11, color: "rgba(255,255,255,0.4)", marginBottom: 14 } }, "Stats will be saved and the tracker reset for the next game."),
          React.createElement("div", { style: { marginBottom: 14 } },
            React.createElement("div", { style: { fontSize: 11, color: "rgba(255,255,255,0.4)", marginBottom: 6 } }, "How many sets were played?"),
            React.createElement("div", { style: { display: "flex", gap: 6 } },
              ...SETS.map(n => React.createElement("button", { key: n, onClick: () => setSetsPlayed(n), style: { flex: 1, background: setsPlayed === n ? ACCENT : "transparent", border: "1px solid " + (setsPlayed === n ? ACCENT : "rgba(255,255,255,0.2)"), borderRadius: 7, color: setsPlayed === n ? "#1a1a2e" : "rgba(255,255,255,0.5)", fontFamily: "'Bebas Neue',sans-serif", fontSize: 14, padding: "7px 2px" } }, n))
            )
          ),
          React.createElement("div", { style: { marginBottom: 14 } },
            React.createElement("div", { style: { fontSize: 11, color: "rgba(255,255,255,0.4)", marginBottom: 6 } }, "Opponent"),
            React.createElement("input", { value: gameLabel, onChange: e => setGameLabel(e.target.value), onKeyDown: e => e.key === "Enter" && onSave(), placeholder: "Opponent name (e.g. Lincoln MS)", autoFocus: true, style: { width: "100%", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 10, color: "#fff", fontSize: 14, padding: "10px 14px", fontFamily: "'DM Sans',sans-serif" } })
          ),
          React.createElement("div", { style: { marginBottom: 14 } },
            React.createElement("div", { style: { fontSize: 11, color: "rgba(255,255,255,0.4)", marginBottom: 6 } }, "Game date"),
            React.createElement("input", { type: "date", value: gameDate, onChange: e => setGameDate(e.target.value), style: { width: "100%", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 10, color: "#fff", fontSize: 14, padding: "10px 14px", fontFamily: "'DM Sans',sans-serif", colorScheme: "dark" } })
          ),
          React.createElement("div", { style: { display: "flex", gap: 9 } },
            React.createElement("button", { onClick: onClose, style: { flex: 1, background: "transparent", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 9, color: "rgba(255,255,255,0.5)", fontSize: 13, padding: 10, fontFamily: "'DM Sans',sans-serif" } }, "Cancel"),
            React.createElement("button", { onClick: onSave, style: { flex: 2, background: ACCENT, border: "none", borderRadius: 9, color: "#1a1a2e", fontSize: 14, fontWeight: 700, padding: 10, fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 1.5 } }, "SAVE GAME")
          )
        )
      );
    }

    // ── Game detail modal ──────────────────────────────────────────────────────
    function GameDetailModal({ game, onClose, onDelete }) {
      const [sv, setSv] = useState("all");
      if (!game) return null;

      const calc = (p) => {
        if (sv === "all") return { pos: sumSetPos(p.sets), err: sumSetErr(p.sets) };
        return { pos: Object.assign({}, p.sets && p.sets[sv] && p.sets[sv].pos), err: Object.assign({}, p.sets && p.sets[sv] && p.sets[sv].err) };
      };

      return React.createElement("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.82)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 16, overflowY: "auto" }, onClick: onClose },
        React.createElement("div", { style: { background: "#2d1060", border: "1px solid rgba(192,132,252,0.3)", borderRadius: 16, padding: 22, width: "100%", maxWidth: 420 }, onClick: e => e.stopPropagation() },
          React.createElement("div", { style: { display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 14 } },
            React.createElement("div", null,
              React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, letterSpacing: 2, color: ACCENT } }, game.label),
              React.createElement("div", { style: { fontSize: 10, color: "rgba(255,255,255,0.35)" } }, game.date + " · " + (game.setsPlayed || 3) + " sets")
            ),
            React.createElement("button", { onClick: onClose, style: { background: "transparent", border: "none", color: "rgba(255,255,255,0.3)", fontSize: 18 } }, "✕")
          ),
          React.createElement("div", { style: { display: "flex", gap: 5, marginBottom: 14 } },
            ...["all", 1, 2, 3, 4, 5].map(s => React.createElement("button", { key: s, onClick: () => setSv(s), style: { flex: 1, background: sv === s ? ACCENT : "transparent", border: "1px solid " + (sv === s ? ACCENT : "rgba(255,255,255,0.15)"), borderRadius: 6, color: sv === s ? "#1a1a2e" : "rgba(255,255,255,0.4)", fontFamily: "'Bebas Neue',sans-serif", fontSize: 10, padding: "5px 1px" } }, s === "all" ? "ALL" : "S" + s))
          ),
          React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 7 } },
            ...game.players.map(p => {
              const d = calc(p);
              return React.createElement("div", { key: p.name, style: { background: "rgba(255,255,255,0.04)", borderRadius: 9, padding: "9px 11px" } },
                React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 } },
                  React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 15, letterSpacing: 1 } }, p.name),
                  React.createElement(NetBadge, { pos: d.pos, err: d.err })
                ),
                React.createElement("div", { style: { display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 3 } },
                  ...POSITIVES.map(t => React.createElement("span", { key: t.key, style: { fontSize: 10, color: POS_COLOR, fontFamily: "'Bebas Neue',sans-serif" } }, t.label + " " + ((d.pos && d.pos[t.key]) || 0)))
                ),
                React.createElement("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } },
                  ...ERRORS.map(t => React.createElement("span", { key: t.key, style: { fontSize: 10, color: ERR_COLOR, fontFamily: "'Bebas Neue',sans-serif" } }, t.label + " " + ((d.err && d.err[t.key]) || 0)))
                )
              );
            })
          ),
          React.createElement("button", { onClick: onDelete, style: { marginTop: 16, width: "100%", background: "rgba(248,113,113,0.1)", border: "1px solid rgba(248,113,113,0.35)", borderRadius: 9, color: "#f87171", fontSize: 12, padding: 9, fontFamily: "'DM Sans',sans-serif" } }, "Delete this game")
        )
      );
    }

    // ── Quick-Log grid ─────────────────────────────────────────────────────────
    function QuickLog({ players, currentSet, onLog, onUndo, lastAction }) {
      const isPos = (key) => POSITIVES.some(p => p.key === key);

      const getCur = (p, key) => {
        const bucket = isPos(key) ? "pos" : "err";
        return (p.sets && p.sets[currentSet] && p.sets[currentSet][bucket] && p.sets[currentSet][bucket][key]) || 0;
      };
      const getAll = (p, key) => {
        const bucket = isPos(key) ? "pos" : "err";
        return SETS.reduce((s, n) => s + ((p.sets && p.sets[n] && p.sets[n][bucket] && p.sets[n][bucket][key]) || 0), 0);
      };

      // Header row
      const headerRow = React.createElement("div", { style: { display: "grid", gridTemplateColumns: "80px repeat(7, 1fr)", gap: 3, marginBottom: 4, paddingLeft: 2 } },
        React.createElement("div", null),
        ...ALL_STATS.map(s => React.createElement("div", { key: s.key, style: { textAlign: "center", fontFamily: "'Bebas Neue',sans-serif", fontSize: 11, letterSpacing: 0.5, color: s.color, lineHeight: 1, paddingBottom: 2 } }, s.icon))
      );

      const playerRows = players.map((p, pi) => {
        const totalPos = sumSetPos(p.sets);
        const totalErr = sumSetErr(p.sets);
        const net = netScore(totalPos, totalErr);
        const netColor = net > 0 ? GREEN : net < 0 ? "#f87171" : "rgba(255,255,255,0.35)";
        const grad = PLAYER_GRADIENTS[pi % PLAYER_GRADIENTS.length];

        const cells = ALL_STATS.map(stat => {
          const cur = getCur(p, stat.key);
          const all = getAll(p, stat.key);
          const active = cur > 0;
          return React.createElement("button", {
            key: stat.key,
            onClick: () => onLog(p.id, stat.key),
            onMouseDown: e => { e.currentTarget.style.transform = "scale(0.88)"; e.currentTarget.style.background = stat.color + "55"; },
            onMouseUp:   e => { e.currentTarget.style.transform = "scale(1)"; },
            onTouchStart:e => { e.currentTarget.style.transform = "scale(0.88)"; e.currentTarget.style.background = stat.color + "55"; },
            onTouchEnd:  e => { e.currentTarget.style.transform = "scale(1)"; },
            style: {
              background: active ? stat.color + "28" : "rgba(255,255,255,0.04)",
              border: "1px solid " + (active ? stat.color + "90" : "rgba(255,255,255,0.08)"),
              borderRadius: 8, padding: "5px 2px",
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
              minHeight: 48, userSelect: "none", WebkitTapHighlightColor: "transparent", transition: "background 0.08s",
            }
          },
            React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, color: active ? stat.color : "rgba(255,255,255,0.2)", lineHeight: 1 } }, cur),
            all !== cur ? React.createElement("span", { style: { fontSize: 7, color: "rgba(255,255,255,0.18)", lineHeight: 1, marginTop: 1 } }, all) : null
          );
        });

        return React.createElement("div", { key: p.id, style: { display: "grid", gridTemplateColumns: "80px repeat(7, 1fr)", gap: 3, marginBottom: 5, alignItems: "center" } },
          // Name + net badge
          React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 5, paddingRight: 4 } },
            React.createElement("div", { style: { width: 24, height: 24, borderRadius: "50%", background: grad, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Bebas Neue',sans-serif", fontSize: 12, color: "#fff", flexShrink: 0 } }, p.name.charAt(0).toUpperCase()),
            React.createElement("div", { style: { minWidth: 0 } },
              React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 12, letterSpacing: 0.5, lineHeight: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, p.name),
              React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 11, color: netColor, lineHeight: 1, marginTop: 1 } }, (net > 0 ? "+" : "") + net)
            )
          ),
          ...cells
        );
      });

      return React.createElement("div", { style: { background: "rgba(255,255,255,0.04)", border: "1px solid rgba(192,132,252,0.18)", borderRadius: 14, padding: "10px 8px 8px" } },
        headerRow,
        ...playerRows,
        lastAction ? React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 8, paddingTop: 4, borderTop: "1px solid rgba(255,255,255,0.06)", marginTop: 2 } },
          React.createElement("span", { style: { fontSize: 11, color: "rgba(255,255,255,0.28)" } },
            "Last: " + lastAction.playerName + " · " + ((ALL_STATS.find(s => s.key === lastAction.key) || {}).icon || "") + " " + lastAction.key
          ),
          React.createElement("button", { onClick: onUndo, style: { background: "transparent", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 6, color: "rgba(255,255,255,0.5)", fontSize: 11, padding: "4px 10px", fontFamily: "'DM Sans',sans-serif" } }, "↩ Undo")
        ) : null
      );
    }

    // ── Game summary ───────────────────────────────────────────────────────────
    function GameSummary({ players }) {
      const [sv, setSv] = useState("all");

      const getStats = (p) => {
        if (sv === "all") return { pos: sumSetPos(p.sets), err: sumSetErr(p.sets) };
        return { pos: Object.assign({}, p.sets && p.sets[sv] && p.sets[sv].pos), err: Object.assign({}, p.sets && p.sets[sv] && p.sets[sv].err) };
      };

      const sorted = [...players].sort((a, b) => {
        const sa = getStats(a), sb = getStats(b);
        return netScore(sb.pos, sb.err) - netScore(sa.pos, sa.err);
      });

      return React.createElement("div", null,
        React.createElement("div", { style: { display: "flex", gap: 6, marginBottom: 16 } },
          ...["all", 1, 2, 3, 4, 5].map(s => React.createElement("button", { key: s, onClick: () => setSv(s), style: { flex: 1, background: sv === s ? ACCENT : "transparent", border: "1px solid " + (sv === s ? ACCENT : "rgba(255,255,255,0.15)"), borderRadius: 7, color: sv === s ? "#1a1a2e" : "rgba(255,255,255,0.4)", fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 0, fontSize: 11, padding: "6px 2px" } }, s === "all" ? "ALL" : "SET " + s))
        ),
        // Totals tiles
