<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VB Tracker" />
  <title>VB Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f5f5f5; }
    body { -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); color: #111; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
    input::placeholder { color: rgba(0,0,0,0.3); }
    input:focus { outline: none; }
    button { cursor: pointer; }
    #root { min-height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script>
  (function() {
    'use strict';
    const { useState, useEffect } = React;

    // ── Constants ──────────────────────────────────────────────────────────────
    const POS_COLOR = "#16a34a";
    const ERR_COLOR = "#dc2626";
    const ATT_COLOR = "#2563eb"; // blue — neutral attack attempts
    const POSITIVES = [
      { key: "kills",  label: "Kill",  icon: "Kill", color: POS_COLOR },
      { key: "aces",   label: "Ace",   icon: "Ace",  color: POS_COLOR },
      { key: "digs",   label: "Dig",   icon: "Dig",  color: POS_COLOR },
    ];
    const NEUTRALS = [
      { key: "attempts", label: "Att", icon: "Att", color: ATT_COLOR },
    ];
    const ERRORS = [
      { key: "serve",    label: "Serve", icon: "Srv", color: ERR_COLOR },
      { key: "hit",      label: "Hit",   icon: "Hit", color: ERR_COLOR },
      { key: "pass",     label: "Pass",  icon: "Pas", color: ERR_COLOR },
      { key: "position", label: "Pos",   icon: "Pos", color: ERR_COLOR },
    ];
    const ALL_STATS = [...POSITIVES, ...NEUTRALS, ...ERRORS];
    const PLAYER_GRADIENTS = [
      "linear-gradient(135deg,#111,#444)",
      "linear-gradient(135deg,#333,#111)",
      "linear-gradient(135deg,#222,#555)",
      "linear-gradient(135deg,#444,#111)",
      "linear-gradient(135deg,#111,#333)",
      "linear-gradient(135deg,#555,#222)",
      "linear-gradient(135deg,#222,#444)",
      "linear-gradient(135deg,#333,#555)",
      "linear-gradient(135deg,#444,#222)",
      "linear-gradient(135deg,#111,#555)",
      "linear-gradient(135deg,#555,#333)",
      "linear-gradient(135deg,#222,#111)",
    ];
    const ACCENT = "#111";
    const GREEN  = "#16a34a";
    const BG     = "#f5f5f5";
    const SETS   = [1, 2, 3, 4, 5];

    const emptyPos     = () => ({ kills: 0, aces: 0, digs: 0, attempts: 0, passRatings: [] });
    const emptyErr     = () => ({ serve: 0, hit: 0, pass: 0, position: 0 });
    const emptySetStat = () => ({ 1: { pos: emptyPos(), err: emptyErr() }, 2: { pos: emptyPos(), err: emptyErr() }, 3: { pos: emptyPos(), err: emptyErr() }, 4: { pos: emptyPos(), err: emptyErr() }, 5: { pos: emptyPos(), err: emptyErr() } });

    // Attack efficiency = (kills - hit_errors) / (kills + hit_errors + attempts)
    const attackEff = (pos, err) => {
      const total = (pos.kills||0) + (err.hit||0) + (pos.attempts||0);
      if (total === 0) return null;
      return ((pos.kills||0) - (err.hit||0)) / total;
    };
    const fmtEff = (v) => v === null ? "—" : (v >= 0 ? "+" : "") + (v * 100).toFixed(0) + "%";

    // Average pass rating
    const avgPass = (pos) => {
      const r = pos && pos.passRatings;
      if (!r || r.length === 0) return null;
      return r.reduce((s, v) => s + v, 0) / r.length;
    };
    const fmtPass = (v) => v === null ? "—" : v.toFixed(1);

    // Rotation sideout % from scoreLog
    // Volleyball rotation: server's rotation. We track lineup as array of names.
    // For sideout tracking we use set-level index: which of the 6 rotation slots won receiving rally.
    // We approximate rotation number by counting service changes within a set.
    const calcRotationStats = (scoreLog) => {
      // Returns { rotationN: { sideouts, total } } per set
      // We track when possession (who is serving) changes to determine rotation
      const result = {};
      let curServer = null; // "us" or "them"
      let rotNum = 0; // our rotation number (0-5), increments each time we rotate in
      SETS.forEach(s => { result[s] = {}; for (let i=0;i<6;i++) result[s][i] = {sideouts:0,total:0}; });

      scoreLog.forEach((entry, i) => {
        const prev = i > 0 ? scoreLog[i-1] : { scoreUs: 0, scoreThem: 0, set: entry.set };
        if (entry.set !== prev.set) { curServer = null; rotNum = 0; }
        const weScored = entry.scoreUs > prev.scoreUs;
        const theyScored = entry.scoreThem > prev.scoreThem;
        const prevServer = curServer;

        // Determine who served this point (server from prev state)
        // First point of set: assume "them" serving (we receive) for sideout tracking
        if (curServer === null) curServer = "them";

        const receiving = curServer === "them"; // we are receiving = sideout opportunity
        if (receiving) {
          const rot = rotNum % 6;
          if (!result[entry.set]) result[entry.set] = {};
          if (!result[entry.set][rot]) result[entry.set][rot] = {sideouts:0,total:0};
          result[entry.set][rot].total++;
          if (weScored) result[entry.set][rot].sideouts++;
        }

        // Update server for next point
        if (weScored) {
          if (curServer === "them") { curServer = "us"; rotNum++; } // we rotate in
        } else if (theyScored) {
          if (curServer === "us") curServer = "them";
        }
      });
      return result;
    };

    const sumPos   = (p) => POSITIVES.reduce((s, t) => s + ((p && p[t.key]) || 0), 0);
    const sumErr   = (e) => ERRORS.reduce((s, t) => s + ((e && e[t.key]) || 0), 0);
    const netScore = (pos, err) => sumPos(pos) - sumErr(err);

    const sumSetPos = (sets) => {
      const r = emptyPos();
      SETS.forEach(n => {
        const pos = sets && sets[n] && sets[n].pos;
        if (!pos) return;
        POSITIVES.forEach(t => { r[t.key] += pos[t.key] || 0; });
        r.attempts += pos.attempts || 0;
        r.passRatings = [...r.passRatings, ...(pos.passRatings || [])];
      });
      return r;
    };
    const sumSetErr = (sets) => {
      const r = emptyErr();
      SETS.forEach(n => ERRORS.forEach(t => { r[t.key] += (sets && sets[n] && sets[n].err && sets[n].err[t.key]) || 0; }));
      return r;
    };

    // ── Storage ────────────────────────────────────────────────────────────────
    const load    = (k) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } };
    const persist = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    // ── Sparkline ──────────────────────────────────────────────────────────────
    function Sparkline({ values, color, h, w }) {
      color = color || "#e63946"; h = h || 22; w = w || 72;
      if (!values || values.length < 2) return null;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;
      const pts = values.map((v, i) => {
        const x = (i / (values.length - 1)) * w;
        const y = h - ((v - min) / range) * (h - 6) - 3;
        return x + "," + y;
      }).join(" ");
      return React.createElement("svg", { width: w, height: h, style: { display: "block", flexShrink: 0 } },
        React.createElement("polyline", { points: pts, fill: "none", stroke: color, strokeWidth: "1.8", strokeLinejoin: "round", strokeLinecap: "round" }),
        ...values.map((v, i) => {
          const x = (i / (values.length - 1)) * w;
          const y = h - ((v - min) / range) * (h - 6) - 3;
          return React.createElement("circle", { key: i, cx: x, cy: y, r: "2.5", fill: color });
        })
      );
    }

    // ── Atoms ──────────────────────────────────────────────────────────────────
    function Tile({ icon, value, label, color, sub }) {
      return React.createElement("div", {
        style: { flex: "1 1 52px", background: color + "18", border: "1px solid " + color + "44", borderRadius: 10, padding: "8px 4px", textAlign: "center" }
      },
        React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, color, lineHeight: 1.1 } }, value),
        React.createElement("div", { style: { fontSize: 9, color: color, marginTop: 1, fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 0.5 } }, label),
        sub != null ? React.createElement("div", { style: { fontSize: 8, color: "rgba(0,0,0,0.3)" } }, sub) : null
      );
    }

    function SL({ children }) {
      return React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 11, letterSpacing: 2, color: "rgba(0,0,0,0.35)", marginBottom: 7 } }, children);
    }

    function Empty({ text, sub }) {
      return React.createElement("div", { style: { textAlign: "center", padding: "56px 20px" } },
        React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 18, letterSpacing: 2, color: "rgba(0,0,0,0.2)" } }, text),
        sub ? React.createElement("div", { style: { fontSize: 11, color: "rgba(0,0,0,0.15)", marginTop: 6 } }, sub) : null
      );
    }

    function NetBadge({ pos, err }) {
      const net = netScore(pos, err);
      const color = net > 0 ? GREEN : net < 0 ? ERR_COLOR : "rgba(0,0,0,0.25)";
      const label = net > 0 ? "+" + net : "" + net;
      return React.createElement("span", {
        style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 14, color, background: color + "18", border: "1px solid " + color + "55", borderRadius: 6, padding: "1px 7px" }
      }, label);
    }

    // ── Confirm modal ──────────────────────────────────────────────────────────
    function ConfirmModal({ modal, onConfirm, onCancel }) {
      if (!modal) return null;
      return React.createElement("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.78)", zIndex: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 } },
        React.createElement("div", { style: { background: "#fff", border: "1px solid rgba(0,0,0,0.15)", borderRadius: 16, padding: 26, width: "100%", maxWidth: 320, textAlign: "center", boxShadow: "0 8px 32px rgba(0,0,0,0.12)" } },
          React.createElement("div", { style: { fontSize: 26, marginBottom: 12 } }, "⚠️"),
          React.createElement("div", { style: { fontSize: 14, color: "#111", lineHeight: 1.5, marginBottom: 20 } }, modal.message),
          React.createElement("div", { style: { display: "flex", gap: 10 } },
            React.createElement("button", { onClick: onCancel, style: { flex: 1, background: "transparent", border: "1px solid rgba(0,0,0,0.15)", borderRadius: 9, color: "rgba(0,0,0,0.5)", fontSize: 13, padding: 10, fontFamily: "'DM Sans',sans-serif", fontWeight: 700 } }, "Cancel"),
            React.createElement("button", { onClick: onConfirm, style: { flex: 1, background: ERR_COLOR, border: "none", borderRadius: 9, color: "#fff", fontSize: 13, fontWeight: 700, padding: 10, fontFamily: "'DM Sans',sans-serif" } }, "Confirm")
          )
        )
      );
    }

    // ── Save modal ─────────────────────────────────────────────────────────────
    function SaveModal({ open, gamesCount, setsPlayed, setSetsPlayed, gameLabel, setGameLabel, gameDate, setGameDate, onSave, onClose }) {
      if (!open) return null;
      return React.createElement("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.72)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }, onClick: onClose },
        React.createElement("div", { style: { background: "#fff", border: "1px solid rgba(0,0,0,0.15)", borderRadius: 16, padding: 26, width: "100%", maxWidth: 360, boxShadow: "0 8px 32px rgba(0,0,0,0.12)" }, onClick: e => e.stopPropagation() },
          React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, letterSpacing: 2, marginBottom: 6, color: ACCENT } }, "SAVE GAME TO SEASON"),
          React.createElement("div", { style: { fontSize: 11, color: "rgba(0,0,0,0.4)", marginBottom: 14 } }, "Stats will be saved and the tracker reset for the next game."),
          React.createElement("div", { style: { marginBottom: 14 } },
            React.createElement("div", { style: { fontSize: 11, color: "rgba(0,0,0,0.4)", marginBottom: 6 } }, "How many sets were played?"),
            React.createElement("div", { style: { display: "flex", gap: 6 } },
              ...SETS.map(n => React.createElement("button", { key: n, onClick: () => setSetsPlayed(n), style: { flex: 1, background: setsPlayed === n ? ACCENT : "#f5f5f5", border: "1px solid " + (setsPlayed === n ? ACCENT : "rgba(0,0,0,0.12)"), borderRadius: 7, color: setsPlayed === n ? "#fff" : "rgba(0,0,0,0.45)", fontFamily: "'Bebas Neue',sans-serif", fontSize: 14, padding: "7px 2px" } }, n))
            )
          ),
          React.createElement("div", { style: { marginBottom: 14 } },
            React.createElement("div", { style: { fontSize: 11, color: "rgba(0,0,0,0.4)", marginBottom: 6 } }, "Opponent"),
            React.createElement("input", { value: gameLabel, onChange: e => setGameLabel(e.target.value), onKeyDown: e => e.key === "Enter" && onSave(), placeholder: "Opponent name (e.g. Lincoln MS)", autoFocus: true, style: { width: "100%", background: "#f0f0f0", border: "1px solid rgba(0,0,0,0.15)", borderRadius: 10, color: "#111", fontSize: 14, padding: "10px 14px", fontFamily: "'DM Sans',sans-serif" } })
          ),
          React.createElement("div", { style: { marginBottom: 14 } },
            React.createElement("div", { style: { fontSize: 11, color: "rgba(0,0,0,0.4)", marginBottom: 6 } }, "Game date"),
            React.createElement("input", { type: "date", value: gameDate, onChange: e => setGameDate(e.target.value), style: { width: "100%", background: "#f0f0f0", border: "1px solid rgba(0,0,0,0.15)", borderRadius: 10, color: "#111", fontSize: 14, padding: "10px 14px", fontFamily: "'DM Sans',sans-serif", colorScheme: "light" } })
          ),
          React.createElement("div", { style: { display: "flex", gap: 9 } },
            React.createElement("button", { onClick: onClose, style: { flex: 1, background: "transparent", border: "1px solid rgba(0,0,0,0.15)", borderRadius: 9, color: "rgba(0,0,0,0.45)", fontSize: 13, padding: 10, fontFamily: "'DM Sans',sans-serif" } }, "Cancel"),
            React.createElement("button", { onClick: onSave, style: { flex: 2, background: ACCENT, border: "none", borderRadius: 9, color: "#fff", fontSize: 14, fontWeight: 700, padding: 10, fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 1.5 } }, "SAVE GAME")
          )
        )
      );
    }

    // ── Game detail modal ──────────────────────────────────────────────────────
    function GameDetailModal({ game, onClose, onDelete }) {
      const [sv, setSv] = useState("all");
      if (!game) return null;

      const calc = (p) => {
        if (sv === "all") return { pos: sumSetPos(p.sets), err: sumSetErr(p.sets) };
        return { pos: Object.assign({}, p.sets && p.sets[sv] && p.sets[sv].pos), err: Object.assign({}, p.sets && p.sets[sv] && p.sets[sv].err) };
      };

      return React.createElement("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.82)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 16, overflowY: "auto" }, onClick: onClose },
        React.createElement("div", { style: { background: "#fff", border: "1px solid rgba(0,0,0,0.15)", borderRadius: 16, padding: 22, width: "100%", maxWidth: 420, boxShadow: "0 8px 32px rgba(0,0,0,0.12)" }, onClick: e => e.stopPropagation() },
          React.createElement("div", { style: { display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 14 } },
            React.createElement("div", null,
              React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, letterSpacing: 2, color: ACCENT } }, game.label),
              React.createElement("div", { style: { fontSize: 10, color: "rgba(0,0,0,0.35)" } }, game.date + " · " + (game.setsPlayed || 3) + " sets")
            ),
            React.createElement("button", { onClick: onClose, style: { background: "transparent", border: "none", color: "rgba(0,0,0,0.3)", fontSize: 18 } }, "✕")
          ),
          React.createElement("div", { style: { display: "flex", gap: 5, marginBottom: 14 } },
            ...["all", 1, 2, 3, 4, 5].map(s => React.createElement("button", { key: s, onClick: () => setSv(s), style: { flex: 1, background: sv === s ? ACCENT : "#f5f5f5", border: "1px solid " + (sv === s ? ACCENT : "rgba(0,0,0,0.1)"), borderRadius: 6, color: sv === s ? "#fff" : "rgba(0,0,0,0.4)", fontFamily: "'Bebas Neue',sans-serif", fontSize: 10, padding: "5px 1px" } }, s === "all" ? "ALL" : "S" + s))
          ),
          React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 7 } },
            ...game.players.map(p => {
              const d = calc(p);
              return React.createElement("div", { key: p.name, style: { background: "#f0f0f0", borderRadius: 9, padding: "9px 11px" } },
                React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 } },
                  React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 15, letterSpacing: 1, color: "#111" } }, p.name),
                  React.createElement(NetBadge, { pos: d.pos, err: d.err })
                ),
                React.createElement("div", { style: { display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 3 } },
                  ...POSITIVES.map(t => React.createElement("span", { key: t.key, style: { fontSize: 10, color: POS_COLOR, fontFamily: "'Bebas Neue',sans-serif" } }, t.label + " " + ((d.pos && d.pos[t.key]) || 0)))
                ),
                React.createElement("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } },
                  ...ERRORS.map(t => React.createElement("span", { key: t.key, style: { fontSize: 10, color: ERR_COLOR, fontFamily: "'Bebas Neue',sans-serif" } }, t.label + " " + ((d.err && d.err[t.key]) || 0)))
                )
              );
            })
          ),
          game.scoreLog && game.scoreLog.length > 0 ? React.createElement("div", { style: { marginTop: 16 } },
            React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 } },
              React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 11, letterSpacing: 2, color: "rgba(0,0,0,0.35)" } }, "COURT TIME · " + game.scoreLog.length + " PTS"),
              React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 18, color: game.scoreUs > game.scoreThem ? GREEN : game.scoreUs < game.scoreThem ? ERR_COLOR : "#111" } }, game.scoreUs + " — " + game.scoreThem)
            ),
            React.createElement(CourtTimePanel, { scoreLog: game.scoreLog, players: game.players.map(p => ({ name: p.name, id: p.name })) })
          ) : null,
          React.createElement("button", { onClick: onDelete, style: { marginTop: 16, width: "100%", background: "rgba(220,38,38,0.06)", border: "1px solid rgba(220,38,38,0.25)", borderRadius: 9, color: ERR_COLOR, fontSize: 12, padding: 9, fontFamily: "'DM Sans',sans-serif" } }, "Delete this game")
        )
      );
    }

    // ── Pass Rating Modal ──────────────────────────────────────────────────────
    function PassRatingModal({ open, playerName, onRate, onSkip }) {
      if (!open) return null;
      const ratings = [
        { v: 3, label: "3", sub: "Perfect", color: GREEN },
        { v: 2, label: "2", sub: "Good", color: "#16a34a" },
        { v: 1, label: "1", sub: "Poor", color: "#f59e0b" },
        { v: 0, label: "0", sub: "Error/Ace", color: ERR_COLOR },
      ];
      return React.createElement("div", {
        style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", zIndex: 800, display: "flex", alignItems: "flex-end", justifyContent: "center", padding: "0 0 24px" },
        onClick: onSkip
      },
        React.createElement("div", {
          style: { background: "#fff", border: "1px solid rgba(0,0,0,0.15)", borderRadius: 16, padding: "16px 16px 12px", width: "100%", maxWidth: 380, boxShadow: "0 -4px 24px rgba(0,0,0,0.12)" },
          onClick: e => e.stopPropagation()
        },
          React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 } },
            React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 13, letterSpacing: 1.5, color: "rgba(0,0,0,0.4)" } },
              "PASS RATING · " + (playerName || "").toUpperCase()
            ),
            React.createElement("button", { onClick: onSkip, style: { background: "transparent", border: "none", color: "rgba(0,0,0,0.3)", fontSize: 16, padding: 0 } }, "✕")
          ),
          React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8 } },
            ...ratings.map(r => React.createElement("button", {
              key: r.v,
              onClick: () => onRate(r.v),
              style: {
                background: r.color + "12", border: "2px solid " + r.color,
                borderRadius: 12, padding: "12px 4px", textAlign: "center",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 2
              }
            },
              React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 32, color: r.color, lineHeight: 1 } }, r.label),
              React.createElement("span", { style: { fontSize: 9, color: r.color, fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 0.5 } }, r.sub)
            ))
          ),
          React.createElement("button", { onClick: onSkip, style: { marginTop: 10, width: "100%", background: "transparent", border: "1px solid rgba(0,0,0,0.1)", borderRadius: 8, color: "rgba(0,0,0,0.3)", fontSize: 11, padding: "7px", fontFamily: "'DM Sans',sans-serif" } }, "Skip rating")
        )
      );
    }

    // ── Rotation Sideout Panel ─────────────────────────────────────────────────
    function RotationSideoutPanel({ scoreLog }) {
      if (!scoreLog || scoreLog.length < 3) return React.createElement("div", { style: { fontSize: 11, color: "rgba(0,0,0,0.3)", fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 1, textAlign: "center", padding: "10px 0" } }, "LOG MORE POINTS TO SEE ROTATION DATA");
      const rotStats = calcRotationStats(scoreLog);
      // Flatten across all sets

    // ── Court Time / Score helpers ─────────────────────────────────────────────
    function calcCourtTime(scoreLog, players) {
      // scoreLog: [{ set, scoreUs, scoreThem, lineup: [name,...] }, ...]
      // Returns per-player: { pointsPlayed, teamWon, teamLost }
      const stats = {};
      players.forEach(p => { stats[p.name] = { pointsPlayed: 0, teamWon: 0, teamLost: 0 }; });
      for (let i = 0; i < scoreLog.length; i++) {
        const entry = scoreLog[i];
        const prev  = i > 0 ? scoreLog[i - 1] : { scoreUs: 0, scoreThem: 0 };
        const weScored = entry.scoreUs > prev.scoreUs;
        entry.lineup.forEach(name => {
          if (!stats[name]) stats[name] = { pointsPlayed: 0, teamWon: 0, teamLost: 0 };
          stats[name].pointsPlayed++;
          if (weScored) stats[name].teamWon++;
          else          stats[name].teamLost++;
        });
      }
      return stats;
    }
