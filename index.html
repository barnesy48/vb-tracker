<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="VB Tracker" />
  <title>VB Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0d1b2a; }
    body { -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    input::placeholder { color: rgba(255,255,255,0.25); }
    input:focus { outline: none; }
    button { cursor: pointer; }
    #root { min-height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script>
  (function() {
    'use strict';
    const { useState, useEffect, useCallback } = React;

    // ── Constants ──────────────────────────────────────────────────────────────
    const ERRORS = [
      { key: "serve",    label: "Serve",    icon: "🏐", color: "#e63946" },
      { key: "hit",      label: "Hit",      icon: "💥", color: "#f4a261" },
      { key: "pass",     label: "Pass",     icon: "🤲", color: "#457b9d" },
      { key: "position", label: "Position", icon: "📍", color: "#9b59b6" },
    ];
    const ACCENT = "#f4d03f";
    const GREEN  = "#2ecc71";
    const BG     = "linear-gradient(160deg,#0d1b2a 0%,#1a2f1e 50%,#0d1b2a 100%)";
    const SETS   = [1, 2, 3];

    const emptyErrors  = () => ({ serve: 0, hit: 0, pass: 0, position: 0 });
    const emptySetErrs = () => ({ 1: emptyErrors(), 2: emptyErrors(), 3: emptyErrors() });
    const sumErrors    = (e) => ERRORS.reduce((s, t) => s + ((e && e[t.key]) || 0), 0);
    const sumAllSets   = (se) => SETS.reduce((s, n) => s + sumErrors(se && se[n]), 0);

    // ── Storage (localStorage fallback since no artifact runtime) ──────────────
    const load = (k) => {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
      catch { return null; }
    };
    const persist = (k, v) => {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
    };

    // ── Sparkline ──────────────────────────────────────────────────────────────
    function Sparkline({ values, color, h, w }) {
      color = color || "#e63946"; h = h || 22; w = w || 72;
      if (!values || values.length < 2) return null;
      const max = Math.max(...values, 1);
      const pts = values.map((v, i) => {
        const x = (i / (values.length - 1)) * w;
        const y = h - (v / max) * (h - 4) - 2;
        return x + "," + y;
      }).join(" ");
      return React.createElement("svg", { width: w, height: h, style: { display: "block", flexShrink: 0 } },
        React.createElement("polyline", { points: pts, fill: "none", stroke: color, strokeWidth: "1.8", strokeLinejoin: "round", strokeLinecap: "round" }),
        ...values.map((v, i) => {
          const x = (i / (values.length - 1)) * w;
          const y = h - (v / max) * (h - 4) - 2;
          return React.createElement("circle", { key: i, cx: x, cy: y, r: "2.2", fill: color });
        })
      );
    }

    // ── Tile ──────────────────────────────────────────────────────────────────
    function Tile({ icon, value, label, color, sub }) {
      return React.createElement("div", {
        style: { flex: "1 1 58px", background: color + "18", border: "1px solid " + color + "44", borderRadius: 10, padding: "10px 5px", textAlign: "center" }
      },
        React.createElement("div", { style: { fontSize: 15 } }, icon),
        React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 22, color, lineHeight: 1.1 } }, value),
        React.createElement("div", { style: { fontSize: 9, color: "rgba(255,255,255,0.4)", marginTop: 1 } }, label),
        sub != null ? React.createElement("div", { style: { fontSize: 8, color: "rgba(255,255,255,0.22)" } }, sub) : null
      );
    }

    function SL({ children }) {
      return React.createElement("div", {
        style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 11, letterSpacing: 2, color: "rgba(255,255,255,0.3)", marginBottom: 7 }
      }, children);
    }

    function Empty({ text, sub }) {
      return React.createElement("div", { style: { textAlign: "center", padding: "56px 20px" } },
        React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 18, letterSpacing: 2, color: "rgba(255,255,255,0.18)" } }, text),
        sub ? React.createElement("div", { style: { fontSize: 11, color: "rgba(255,255,255,0.12)", marginTop: 6 } }, sub) : null
      );
    }

    // ── Confirm modal ─────────────────────────────────────────────────────────
    function ConfirmModal({ modal, onConfirm, onCancel }) {
      if (!modal) return null;
      return React.createElement("div", {
        style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.78)", zIndex: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }
      },
        React.createElement("div", {
          style: { background: "#1a2b1e", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 16, padding: 26, width: "100%", maxWidth: 320, textAlign: "center" }
        },
          React.createElement("div", { style: { fontSize: 26, marginBottom: 12 } }, "⚠️"),
          React.createElement("div", { style: { fontSize: 14, color: "rgba(255,255,255,0.85)", lineHeight: 1.5, marginBottom: 20 } }, modal.message),
          React.createElement("div", { style: { display: "flex", gap: 10 } },
            React.createElement("button", { onClick: onCancel, style: { flex: 1, background: "transparent", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 9, color: "rgba(255,255,255,0.6)", fontSize: 13, padding: 10, fontFamily: "'DM Sans',sans-serif", fontWeight: 700 } }, "Cancel"),
            React.createElement("button", { onClick: onConfirm, style: { flex: 1, background: "#e63946", border: "none", borderRadius: 9, color: "#fff", fontSize: 13, fontWeight: 700, padding: 10, fontFamily: "'DM Sans',sans-serif" } }, "Confirm")
          )
        )
      );
    }

    // ── Save modal ────────────────────────────────────────────────────────────
    function SaveModal({ open, gamesCount, setsPlayed, setSetsPlayed, gameLabel, setGameLabel, onSave, onClose }) {
      if (!open) return null;
      return React.createElement("div", {
        style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.72)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 },
        onClick: onClose
      },
        React.createElement("div", {
          style: { background: "#1a2b1e", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 16, padding: 26, width: "100%", maxWidth: 360 },
          onClick: e => e.stopPropagation()
        },
          React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, letterSpacing: 2, marginBottom: 6, color: ACCENT } }, "SAVE GAME TO SEASON"),
          React.createElement("div", { style: { fontSize: 11, color: "rgba(255,255,255,0.4)", marginBottom: 14 } }, "Stats will be saved and the tracker reset for the next game."),
          React.createElement("div", { style: { marginBottom: 14 } },
            React.createElement("div", { style: { fontSize: 11, color: "rgba(255,255,255,0.4)", marginBottom: 6 } }, "How many sets were played?"),
            React.createElement("div", { style: { display: "flex", gap: 6 } },
              ...SETS.map(n => React.createElement("button", {
                key: n,
                onClick: () => setSetsPlayed(n),
                style: { flex: 1, background: setsPlayed === n ? ACCENT : "transparent", border: "1px solid " + (setsPlayed === n ? ACCENT : "rgba(255,255,255,0.2)"), borderRadius: 7, color: setsPlayed === n ? "#1a1a2e" : "rgba(255,255,255,0.5)", fontFamily: "'Bebas Neue',sans-serif", fontSize: 16, padding: "8px" }
              }, "SET " + n))
            )
          ),
          React.createElement("input", {
            value: gameLabel,
            onChange: e => setGameLabel(e.target.value),
            onKeyDown: e => e.key === "Enter" && onSave(),
            placeholder: "Game " + (gamesCount + 1) + " (or enter opponent name)",
            autoFocus: true,
            style: { width: "100%", background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 10, color: "#fff", fontSize: 14, padding: "10px 14px", fontFamily: "'DM Sans',sans-serif", marginBottom: 14 }
          }),
          React.createElement("div", { style: { display: "flex", gap: 9 } },
            React.createElement("button", { onClick: onClose, style: { flex: 1, background: "transparent", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 9, color: "rgba(255,255,255,0.5)", fontSize: 13, padding: 10, fontFamily: "'DM Sans',sans-serif" } }, "Cancel"),
            React.createElement("button", { onClick: onSave, style: { flex: 2, background: ACCENT, border: "none", borderRadius: 9, color: "#1a1a2e", fontSize: 14, fontWeight: 700, padding: 10, fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 1.5 } }, "SAVE GAME")
          )
        )
      );
    }

    // ── Game detail modal ──────────────────────────────────────────────────────
    function GameDetailModal({ game, onClose, onDelete }) {
      const [sv, setSv] = useState("all");
      if (!game) return null;

      const calc = (p) => {
        if (sv === "all") {
          const err = emptyErrors();
          SETS.forEach(n => ERRORS.forEach(e => { err[e.key] += (p.setErrors && p.setErrors[n] && p.setErrors[n][e.key]) || 0; }));
          return { points: SETS.reduce((s, n) => s + ((p.points && p.points[n]) || 0), 0), errors: err };
        }
        return { points: (p.points && p.points[sv]) || 0, errors: Object.assign({}, p.setErrors && p.setErrors[sv]) };
      };

      return React.createElement("div", {
        style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.82)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 16, overflowY: "auto" },
        onClick: onClose
      },
        React.createElement("div", {
          style: { background: "#1a2b1e", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 16, padding: 22, width: "100%", maxWidth: 420 },
          onClick: e => e.stopPropagation()
        },
          React.createElement("div", { style: { display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 14 } },
            React.createElement("div", null,
              React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, letterSpacing: 2, color: ACCENT } }, game.label),
              React.createElement("div", { style: { fontSize: 10, color: "rgba(255,255,255,0.35)" } }, game.date + " · " + (game.setsPlayed || 3) + " sets played")
            ),
            React.createElement("button", { onClick: onClose, style: { background: "transparent", border: "none", color: "rgba(255,255,255,0.3)", fontSize: 18 } }, "✕")
          ),
          React.createElement("div", { style: { display: "flex", gap: 5, marginBottom: 14 } },
            ...["all", 1, 2, 3].map(s => React.createElement("button", {
              key: s,
              onClick: () => setSv(s),
              style: { flex: 1, background: sv === s ? ACCENT : "transparent", border: "1px solid " + (sv === s ? ACCENT : "rgba(255,255,255,0.15)"), borderRadius: 6, color: sv === s ? "#1a1a2e" : "rgba(255,255,255,0.4)", fontFamily: "'Bebas Neue',sans-serif", fontSize: 11, padding: "5px 2px" }
            }, s === "all" ? "ALL" : "S" + s))
          ),
          React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 7 } },
            ...game.players.map(p => {
              const d = calc(p);
              const tot = sumErrors(d.errors);
              return React.createElement("div", {
                key: p.name,
                style: { background: "rgba(255,255,255,0.04)", borderRadius: 9, padding: "9px 11px" }
              },
                React.createElement("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: 4 } },
                  React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 15, letterSpacing: 1 } }, p.name),
                  React.createElement("span", { style: { fontSize: 12, color: "rgba(255,255,255,0.4)" } },
                    React.createElement("span", { style: { color: GREEN } }, "⭐ " + d.points),
                    "  ✕ " + tot
                  )
                ),
                React.createElement("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } },
                  ...ERRORS.map(e => React.createElement("span", { key: e.key, style: { fontSize: 10, color: "rgba(255,255,255,0.4)" } },
                    React.createElement("span", { style: { color: e.color } }, e.icon),
                    " " + ((d.errors && d.errors[e.key]) || 0)
                  ))
                )
              );
            })
          ),
          React.createElement("button", {
            onClick: onDelete,
            style: { marginTop: 16, width: "100%", background: "rgba(230,57,70,0.1)", border: "1px solid rgba(230,57,70,0.35)", borderRadius: 9, color: "#e63946", fontSize: 12, padding: 9, fontFamily: "'DM Sans',sans-serif" }
          }, "Delete this game")
        )
      );
    }

    // ── Quick-Log grid ─────────────────────────────────────────────────────────
    function QuickLog({ players, currentSet, onLog, onUndo, lastAction }) {
      const cols = [
        { key: "points", label: "PTS", icon: "⭐", color: GREEN },
        ...ERRORS.map(e => ({ key: e.key, label: e.label.slice(0, 3).toUpperCase(), icon: e.icon, color: e.color })),
      ];

      const getCur = (p, key) =>
        key === "points" ? ((p.points && p.points[currentSet]) || 0) : ((p.setErrors && p.setErrors[currentSet] && p.setErrors[currentSet][key]) || 0);
      const getAll = (p, key) =>
        key === "points"
          ? SETS.reduce((s, n) => s + ((p.points && p.points[n]) || 0), 0)
          : SETS.reduce((s, n) => s + ((p.setErrors && p.setErrors[n] && p.setErrors[n][key]) || 0), 0);

      const gridCols = "110px repeat(" + cols.length + ", 1fr)";

      return React.createElement("div", { style: { overflowX: "auto", WebkitOverflowScrolling: "touch" } },
        // Header
        React.createElement("div", { style: { display: "grid", gridTemplateColumns: gridCols, gap: 3, marginBottom: 3, minWidth: 340 } },
          React.createElement("div", null),
          ...cols.map(c => React.createElement("div", { key: c.key, style: { textAlign: "center", lineHeight: 1.2 } },
            React.createElement("div", { style: { fontSize: 13 } }, c.icon),
            React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 9, letterSpacing: 1, color: c.color } }, c.label)
          ))
        ),
        // Rows
        ...players.map(p => React.createElement("div", {
          key: p.id,
          style: { display: "grid", gridTemplateColumns: gridCols, gap: 3, marginBottom: 3, minWidth: 340 }
        },
          React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 6, paddingRight: 4, overflow: "hidden" } },
            React.createElement("div", { style: { width: 26, height: 26, borderRadius: "50%", background: "linear-gradient(135deg," + ACCENT + ",#e67e22)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Bebas Neue',sans-serif", fontSize: 13, color: "#1a1a2e", flexShrink: 0 } },
              p.name.charAt(0).toUpperCase()
            ),
            React.createElement("span", { style: { fontSize: 11, fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 0.8, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, p.name)
          ),
          ...cols.map(c => {
            const cur = getCur(p, c.key);
            const all = getAll(p, c.key);
            const active = cur > 0;
            return React.createElement("button", {
              key: c.key,
              onClick: () => onLog(p.id, c.key),
              onMouseDown: e => { e.currentTarget.style.transform = "scale(0.9)"; e.currentTarget.style.background = c.color + "50"; },
              onMouseUp: e => { e.currentTarget.style.transform = "scale(1)"; },
              onTouchStart: e => { e.currentTarget.style.transform = "scale(0.9)"; e.currentTarget.style.background = c.color + "50"; },
              onTouchEnd: e => { e.currentTarget.style.transform = "scale(1)"; },
              style: { background: active ? c.color + "28" : "rgba(255,255,255,0.04)", border: "1px solid " + (active ? c.color + "70" : "rgba(255,255,255,0.08)"), borderRadius: 8, padding: "5px 2px", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: 46, userSelect: "none", WebkitTapHighlightColor: "transparent", transition: "background 0.08s" }
            },
              React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, color: active ? c.color : "rgba(255,255,255,0.22)", lineHeight: 1 } }, cur),
              all !== cur ? React.createElement("span", { style: { fontSize: 7, color: "rgba(255,255,255,0.18)", lineHeight: 1, marginTop: 1 } }, all + "↑") : null
            );
          })
        )),
        // Undo
        lastAction ? React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "flex-end", marginTop: 10, gap: 8 } },
          React.createElement("span", { style: { fontSize: 11, color: "rgba(255,255,255,0.28)" } },
            "Last: " + lastAction.playerName + " · " + (lastAction.key === "points" ? "⭐" : (ERRORS.find(e => e.key === lastAction.key) || {}).icon || "") + " " + lastAction.key
          ),
          React.createElement("button", { onClick: onUndo, style: { background: "transparent", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 6, color: "rgba(255,255,255,0.5)", fontSize: 11, padding: "4px 10px", fontFamily: "'DM Sans',sans-serif" } }, "↩ Undo")
        ) : null
      );
    }

    // ── Game summary ──────────────────────────────────────────────────────────
    function GameSummary({ players }) {
      const [sv, setSv] = useState("all");

      const getStats = (p) => {
        if (sv === "all") {
          const err = emptyErrors();
          SETS.forEach(n => ERRORS.forEach(e => { err[e.key] += (p.setErrors && p.setErrors[n] && p.setErrors[n][e.key]) || 0; }));
          return { points: SETS.reduce((s, n) => s + ((p.points && p.points[n]) || 0), 0), errors: err };
        }
        return { points: (p.points && p.points[sv]) || 0, errors: Object.assign({}, p.setErrors && p.setErrors[sv]) };
      };

      const totalPts = players.reduce((s, p) => s + getStats(p).points, 0);
      const sorted = [...players].sort((a, b) => sumErrors(getStats(b).errors) - sumErrors(getStats(a).errors));
      const maxErr = Math.max(...sorted.map(p => sumErrors(getStats(p).errors)), 1);

      return React.createElement("div", null,
        React.createElement("div", { style: { display: "flex", gap: 6, marginBottom: 16 } },
          ...["all", 1, 2, 3].map(s => React.createElement("button", {
            key: s, onClick: () => setSv(s),
            style: { flex: 1, background: sv === s ? ACCENT : "transparent", border: "1px solid " + (sv === s ? ACCENT : "rgba(255,255,255,0.15)"), borderRadius: 7, color: sv === s ? "#1a1a2e" : "rgba(255,255,255,0.4)", fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 1, fontSize: 13, padding: "6px 4px" }
          }, s === "all" ? "ALL SETS" : "SET " + s))
        ),
        React.createElement("div", { style: { display: "flex", gap: 7, marginBottom: 18, flexWrap: "wrap" } },
          React.createElement(Tile, { icon: "⭐", value: totalPts, label: "Points", color: GREEN }),
          ...ERRORS.map(e => React.createElement(Tile, {
            key: e.key, icon: e.icon,
            value: players.reduce((s, p) => s + ((getStats(p).errors && getStats(p).errors[e.key]) || 0), 0),
            label: e.label, color: e.color
          }))
        ),
        React.createElement(SL, null, "PLAYERS"),
        React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 7 } },
          ...sorted.map((p, i) => {
            const st = getStats(p);
            const tot = sumErrors(st.errors);
            return React.createElement("div", {
              key: p.id,
              style: { background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 10, padding: "10px 12px" }
            },
              React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 5 } },
                React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 13, color: "rgba(255,255,255,0.25)", minWidth: 18 } }, "#" + (i + 1)),
                React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 15, letterSpacing: 1, flex: 1 } }, p.name),
                React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 15, color: GREEN } }, "⭐ " + st.points),
                React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 15, color: tot > 0 ? "#e63946" : "rgba(255,255,255,0.2)" } }, "✕ " + tot)
              ),
              React.createElement("div", { style: { display: "flex", gap: 2, height: 4, borderRadius: 3, overflow: "hidden", background: "rgba(255,255,255,0.06)", marginBottom: 4 } },
                ...ERRORS.map(e => {
                  const w = tot === 0 ? 0 : ((st.errors && st.errors[e.key]) / maxErr) * 100;
                  return w > 0 ? React.createElement("div", { key: e.key, style: { width: w + "%", background: e.color, borderRadius: 3 } }) : null;
                })
              ),
              React.createElement("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
                ...ERRORS.map(e => React.createElement("span", { key: e.key, style: { fontSize: 10, color: "rgba(255,255,255,0.35)" } },
                  React.createElement("span", { style: { color: e.color } }, e.icon),
                  " " + ((st.errors && st.errors[e.key]) || 0)
                ))
              )
            );
          })
        )
      );
    }

    // ── Season view ───────────────────────────────────────────────────────────
    function SeasonView({ games }) {
      const [filterErr, setFilterErr] = useState(null);

      if (!games.length) return React.createElement(Empty, { text: "NO GAMES SAVED YET", sub: "Save your first game from the tracker" });

      const byPlayer = {};
      games.forEach((game) => {
        const setsThisGame = game.setsPlayed || 3;
        game.players.forEach(p => {
          if (!byPlayer[p.name]) byPlayer[p.name] = { name: p.name, points: 0, errors: emptyErrors(), games: 0, setsPlayed: 0, history: [] };
          const rec = byPlayer[p.name];
          const gErr = emptyErrors();
          SETS.forEach(n => ERRORS.forEach(e => { gErr[e.key] += (p.setErrors && p.setErrors[n] && p.setErrors[n][e.key]) || 0; }));
          const gPts = SETS.reduce((s, n) => s + ((p.points && p.points[n]) || 0), 0);
          rec.points += gPts;
          ERRORS.forEach(e => { rec.errors[e.key] += gErr[e.key]; });
          rec.games++;
          rec.setsPlayed += setsThisGame;
          rec.history.push({ label: game.label, points: gPts, errors: Object.assign({}, gErr) });
        });
      });

      const players = Object.values(byPlayer);
      const getMetric = (p) => filterErr ? p.errors[filterErr] : sumErrors(p.errors);
      const getRate   = (p) => p.setsPlayed ? (getMetric(p) / p.setsPlayed).toFixed(1) : "—";
      const sorted    = [...players].sort((a, b) => getMetric(b) - getMetric(a));
      const maxM      = Math.max(...sorted.map(p => getMetric(p)), 1);

      const totalSets = players.reduce((s, p) => s + p.setsPlayed, 0);
      const avgSets = players.length ? totalSets / players.length : 1;

      return React.createElement("div", null,
        React.createElement("div", { style: { display: "flex", gap: 7, marginBottom: 18, flexWrap: "wrap" } },
          React.createElement(Tile, { icon: "⭐", value: players.reduce((s, p) => s + p.points, 0), label: "Pts", color: GREEN, sub: games.length + "g" }),
          ...ERRORS.map(e => {
            const tot = players.reduce((s, p) => s + p.errors[e.key], 0);
            return React.createElement(Tile, {
              key: e.key, icon: e.icon, value: tot,
              label: e.label.slice(0, 4), color: e.color,
              sub: (avgSets > 0 ? (tot / avgSets).toFixed(1) : "—") + "/set"
            });
          })
        ),
        React.createElement("div", { style: { display: "flex", gap: 5, marginBottom: 14, flexWrap: "wrap" } },
          React.createElement("button", {
            onClick: () => setFilterErr(null),
            style: { background: !filterErr ? ACCENT : "transparent", border: "1px solid " + (!filterErr ? ACCENT : "rgba(255,255,255,0.15)"), borderRadius: 6, color: !filterErr ? "#1a1a2e" : "rgba(255,255,255,0.4)", fontFamily: "'Bebas Neue',sans-serif", fontSize: 10, letterSpacing: 1, padding: "4px 10px" }
          }, "ALL ERRORS"),
          ...ERRORS.map(e => React.createElement("button", {
            key: e.key,
            onClick: () => setFilterErr(filterErr === e.key ? null : e.key),
            style: { background: filterErr === e.key ? e.color + "30" : "transparent", border: "1px solid " + (filterErr === e.key ? e.color : "rgba(255,255,255,0.12)"), borderRadius: 6, color: filterErr === e.key ? e.color : "rgba(255,255,255,0.35)", fontFamily: "'Bebas Neue',sans-serif", fontSize: 10, letterSpacing: 1, padding: "4px 9px" }
          }, e.icon + " " + e.label.slice(0, 3).toUpperCase()))
        ),
        React.createElement(SL, null, "RANKINGS · " + (filterErr ? (ERRORS.find(e => e.key === filterErr) || {}).label.toUpperCase() : "ALL ERRORS")),
        React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
          ...sorted.map((p, i) => {
            const errColor = filterErr ? (ERRORS.find(e => e.key === filterErr) || {}).color : "#e63946";
            const trendVals = p.history.map(h => filterErr ? h.errors[filterErr] : sumErrors(h.errors));
            return React.createElement("div", {
              key: p.name,
              style: { background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 12, padding: "11px 13px" }
            },
              React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 6 } },
                React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 14, color: i === 0 ? ACCENT : "rgba(255,255,255,0.25)", minWidth: 20 } }, "#" + (i + 1)),
                React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 15, letterSpacing: 1, flex: 1 } }, p.name),
                React.createElement("span", { style: { fontSize: 10, color: "rgba(255,255,255,0.25)", marginRight: 4 } }, p.games + "g"),
                React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 12, color: "rgba(255,255,255,0.3)", marginRight: 8 } }, getRate(p) + "/set"),
                React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 20, color: errColor } }, getMetric(p))
              ),
              React.createElement("div", { style: { height: 4, borderRadius: 3, background: "rgba(255,255,255,0.06)", overflow: "hidden", marginBottom: 7 } },
                React.createElement("div", { style: { width: (getMetric(p) / maxM * 100) + "%", height: "100%", background: errColor, borderRadius: 3 } })
              ),
              React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } },
                React.createElement("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } },
                  React.createElement("span", { style: { fontSize: 10, color: "rgba(46,204,113,0.7)" } }, "⭐ " + p.points),
                  ...ERRORS.map(e => React.createElement("span", { key: e.key, style: { fontSize: 10, color: filterErr === e.key ? e.color : "rgba(255,255,255,0.3)" } },
                    React.createElement("span", { style: { color: e.color } }, e.icon),
                    " " + p.errors[e.key]
                  ))
                ),
                trendVals.length > 1 ? React.createElement("div", { style: { marginLeft: 8, flexShrink: 0 } },
                  React.createElement(Sparkline, { values: trendVals, color: errColor })
                ) : null
              )
            );
          })
        )
      );
    }

    // ── Games log ─────────────────────────────────────────────────────────────
    function GamesLog({ games, onSelect }) {
      if (!games.length) return React.createElement(Empty, { text: "NO GAMES SAVED YET", sub: "Save your first game from the tracker" });
      return React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
        ...[...games].reverse().map(game => {
          const gPts = game.players.reduce((s, p) => s + SETS.reduce((ss, n) => ss + ((p.points && p.points[n]) || 0), 0), 0);
          const gErr = game.players.reduce((s, p) => s + sumAllSets(p.setErrors), 0);
          return React.createElement("div", {
            key: game.id,
            onClick: () => onSelect(game),
            onMouseEnter: e => e.currentTarget.style.background = "rgba(255,255,255,0.07)",
            onMouseLeave: e => e.currentTarget.style.background = "rgba(255,255,255,0.04)",
            style: { background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 12, padding: "12px 14px", cursor: "pointer", transition: "background 0.12s" }
          },
            React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } },
              React.createElement("div", null,
                React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 17, letterSpacing: 1.5 } }, game.label),
                React.createElement("div", { style: { fontSize: 10, color: "rgba(255,255,255,0.3)", marginTop: 2 } }, game.date + " · " + (game.setsPlayed || 3) + " sets")
              ),
              React.createElement("div", { style: { textAlign: "right" } },
                React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 15, color: GREEN } }, "⭐ " + gPts),
                React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 13, color: "#e63946" } }, "✕ " + gErr)
              )
            ),
            React.createElement("div", { style: { fontSize: 10, color: "rgba(255,255,255,0.2)", marginTop: 5 } }, game.players.map(p => p.name).join(" · "))
          );
        })
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────
    function App() {
      const [players,      setPlayers]      = useState([]);
      const [roster,       setRoster]       = useState([]);
      const [games,        setGames]        = useState([]);
      const [loading,      setLoading]      = useState(true);
      const [view,         setView]         = useState("track");
      const [currentSet,   setCurrentSet]   = useState(1);
      const [nameInput,    setNameInput]    = useState("");
      const [saveOpen,     setSaveOpen]     = useState(false);
      const [gameLabel,    setGameLabel]    = useState("");
      const [setsPlayed,   setSetsPlayed]   = useState(3);
      const [toast,        setToast]        = useState(null);
      const [confirmModal, setConfirmModal] = useState(null);
      const [selectedGame, setSelectedGame] = useState(null);
      const [lastAction,   setLastAction]   = useState(null);
      const [rosterOpen,   setRosterOpen]   = useState(false);

      const newPlayer = (name) => ({
        id: name, name,
        points:    { 1: 0, 2: 0, 3: 0 },
        setErrors: { 1: emptyErrors(), 2: emptyErrors(), 3: emptyErrors() },
      });

      useEffect(() => {
        const g = load("vb-games");
        const r = load("vb-roster");
        if (g) setGames(g);
        if (r) { setRoster(r); setPlayers(r.map(newPlayer)); }
        setLoading(false);
      }, []);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };
      const confirm   = (message, onConfirm) => setConfirmModal({ message, onConfirm });

      const addPlayer = () => {
        const t = nameInput.trim();
        if (!t || players.find(p => p.name.toLowerCase() === t.toLowerCase())) return;
        const nr = [...roster, t];
        setRoster(nr); persist("vb-roster", nr);
        setPlayers(prev => [...prev, newPlayer(t)]);
        setNameInput("");
      };

      const removePlayer = (id) => {
        const p = players.find(x => x.id === id);
        confirm("Remove " + (p && p.name) + " from the roster?", () => {
          const nr = roster.filter(n => n !== id);
          setRoster(nr); persist("vb-roster", nr);
          setPlayers(prev => prev.filter(x => x.id !== id));
        });
      };

      const handleLog = (playerId, key) => {
        const p = players.find(x => x.id === playerId);
        setLastAction({ playerId, key, playerName: p && p.name, set: currentSet });
        setPlayers(prev => prev.map(pl => {
          if (pl.id !== playerId) return pl;
          if (key === "points") return Object.assign({}, pl, { points: Object.assign({}, pl.points, { [currentSet]: ((pl.points && pl.points[currentSet]) || 0) + 1 }) });
          const newSetErrors = Object.assign({}, pl.setErrors, {
            [currentSet]: Object.assign({}, pl.setErrors && pl.setErrors[currentSet], {
              [key]: ((pl.setErrors && pl.setErrors[currentSet] && pl.setErrors[currentSet][key]) || 0) + 1
            })
          });
          return Object.assign({}, pl, { setErrors: newSetErrors });
        }));
      };

      const handleUndo = () => {
        if (!lastAction) return;
        const { playerId, key, set } = lastAction;
        setPlayers(prev => prev.map(pl => {
          if (pl.id !== playerId) return pl;
          if (key === "points") return Object.assign({}, pl, { points: Object.assign({}, pl.points, { [set]: Math.max(0, ((pl.points && pl.points[set]) || 0) - 1) }) });
          const newSetErrors = Object.assign({}, pl.setErrors, {
            [set]: Object.assign({}, pl.setErrors && pl.setErrors[set], {
              [key]: Math.max(0, ((pl.setErrors && pl.setErrors[set] && pl.setErrors[set][key]) || 0) - 1)
            })
          });
          return Object.assign({}, pl, { setErrors: newSetErrors });
        }));
        setLastAction(null);
      };

      const hasData = players.some(p =>
        SETS.some(n => ((p.points && p.points[n]) || 0) > 0 || sumErrors(p.setErrors && p.setErrors[n]) > 0)
      );

      const resetCurrent = () => confirm("Reset all current stats? This can't be undone.", () => {
        setPlayers(prev => prev.map(p => newPlayer(p.name)));
        setCurrentSet(1); setLastAction(null);
      });

      const saveGame = () => {
        const label = gameLabel.trim() || ("Game " + (games.length + 1));
        const date  = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
        const snap  = players.map(p => ({
          name: p.name,
          points:    Object.assign({}, p.points),
          setErrors: { 1: Object.assign({}, p.setErrors && p.setErrors[1]), 2: Object.assign({}, p.setErrors && p.setErrors[2]), 3: Object.assign({}, p.setErrors && p.setErrors[3]) },
        }));
        const newGames = [...games, { id: Date.now(), label, date, setsPlayed, players: snap }];
        setGames(newGames); persist("vb-games", newGames);
        setPlayers(prev => prev.map(p => newPlayer(p.name)));
        setCurrentSet(1); setLastAction(null);
        setSaveOpen(false); setGameLabel(""); setSetsPlayed(3);
        showToast("✓ \"" + label + "\" saved");
      };

      const deleteGame = (gameId) => {
        const g = games.find(x => x.id === gameId);
        confirm("Delete \"" + (g && g.label) + "\"? This can't be undone.", () => {
          const ng = games.filter(x => x.id !== gameId);
          setGames(ng); persist("vb-games", ng);
          setSelectedGame(null); showToast("Game deleted");
        });
      };

      const VIEWS = [
        { key: "track",   label: "Track" },
        { key: "summary", label: "Summary" },
        { key: "season",  label: "Season" },
        { key: "games",   label: "Games (" + games.length + ")" },
      ];

      if (loading) return React.createElement("div", {
        style: { minHeight: "100vh", background: "#0d1b2a", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Bebas Neue',sans-serif", fontSize: 18, letterSpacing: 3, color: "rgba(255,255,255,0.3)" }
      }, "LOADING…");

      return React.createElement("div", {
        style: { minHeight: "100vh", background: BG, fontFamily: "'DM Sans',sans-serif", color: "#fff", paddingBottom: 60 }
      },
        // Toast
        toast ? React.createElement("div", {
          style: { position: "fixed", top: 65, left: "50%", transform: "translateX(-50%)", background: GREEN, color: "#0d1b2a", borderRadius: 10, padding: "9px 18px", fontWeight: 700, fontSize: 13, zIndex: 999, boxShadow: "0 4px 18px rgba(0,0,0,0.4)", whiteSpace: "nowrap" }
        }, toast) : null,

        React.createElement(ConfirmModal, {
          modal: confirmModal,
          onConfirm: () => { confirmModal.onConfirm(); setConfirmModal(null); },
          onCancel: () => setConfirmModal(null)
        }),
        React.createElement(SaveModal, {
          open: saveOpen, gamesCount: games.length,
          setsPlayed, setSetsPlayed,
          gameLabel, setGameLabel,
          onSave: saveGame, onClose: () => setSaveOpen(false)
        }),
        React.createElement(GameDetailModal, {
          game: selectedGame,
          onClose: () => setSelectedGame(null),
          onDelete: () => deleteGame(selectedGame.id)
        }),

        // Header
        React.createElement("div", {
          style: { background: "rgba(0,0,0,0.35)", backdropFilter: "blur(12px)", borderBottom: "1px solid rgba(255,255,255,0.08)", padding: "12px 14px", position: "sticky", top: 0, zIndex: 100 }
        },
          React.createElement("div", { style: { maxWidth: 700, margin: "0 auto" } },
            React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 } },
              React.createElement("div", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 22, letterSpacing: 3, color: ACCENT, lineHeight: 1 } }, "🏐 VB TRACKER"),
              React.createElement("div", { style: { display: "flex", gap: 7 } },
                view === "track" && hasData ? React.createElement("button", {
                  onClick: () => setSaveOpen(true),
                  style: { background: ACCENT, border: "none", borderRadius: 8, color: "#1a1a2e", fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 1.5, fontSize: 12, padding: "7px 13px" }
                }, "SAVE GAME") : null,
                React.createElement("button", {
                  onClick: () => setRosterOpen(v => !v),
                  style: { background: rosterOpen ? "rgba(255,255,255,0.12)" : "transparent", border: "1px solid rgba(255,255,255,0.2)", borderRadius: 8, color: "rgba(255,255,255,0.6)", fontSize: 12, padding: "7px 11px", fontFamily: "'DM Sans',sans-serif" }
                }, rosterOpen ? "Done" : "✏️ Roster")
              )
            ),

            rosterOpen ? React.createElement("div", {
              style: { marginBottom: 10, background: "rgba(255,255,255,0.04)", borderRadius: 10, padding: "10px 12px" }
            },
              React.createElement("div", { style: { display: "flex", gap: 7, marginBottom: 8 } },
                React.createElement("input", {
                  value: nameInput,
                  onChange: e => setNameInput(e.target.value),
                  onKeyDown: e => e.key === "Enter" && addPlayer(),
                  placeholder: "Add player name…",
                  style: { flex: 1, background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 8, color: "#fff", fontSize: 13, padding: "7px 11px", fontFamily: "'DM Sans',sans-serif" }
                }),
                React.createElement("button", {
                  onClick: addPlayer,
                  style: { background: ACCENT, border: "none", borderRadius: 8, color: "#1a1a2e", fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 1, fontSize: 13, padding: "7px 14px" }
                }, "+ ADD")
              ),
              players.length > 0 ? React.createElement("div", { style: { display: "flex", flexWrap: "wrap", gap: 6 } },
                ...players.map(p => React.createElement("div", {
                  key: p.id,
                  style: { display: "flex", alignItems: "center", gap: 5, background: "rgba(255,255,255,0.07)", borderRadius: 20, padding: "4px 10px 4px 8px" }
                },
                  React.createElement("span", { style: { fontSize: 12, fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 0.5 } }, p.name),
                  React.createElement("button", {
                    onClick: () => removePlayer(p.id),
                    onMouseEnter: e => e.currentTarget.style.color = "#e63946",
                    onMouseLeave: e => e.currentTarget.style.color = "rgba(255,255,255,0.3)",
                    style: { background: "transparent", border: "none", color: "rgba(255,255,255,0.3)", fontSize: 13, padding: 0, lineHeight: 1 }
                  }, "✕")
                ))
              ) : null
            ) : null,

            // Nav tabs
            React.createElement("div", { style: { display: "flex", gap: 5 } },
              ...VIEWS.map(v => React.createElement("button", {
                key: v.key,
                onClick: () => setView(v.key),
                style: { flex: 1, background: view === v.key ? ACCENT : "transparent", border: "1px solid " + (view === v.key ? ACCENT : "rgba(255,255,255,0.15)"), borderRadius: 7, color: view === v.key ? "#1a1a2e" : "rgba(255,255,255,0.4)", fontFamily: "'Bebas Neue',sans-serif", letterSpacing: 0.5, fontSize: 11, padding: "6px 2px" }
              }, v.label))
            )
          )
        ),

        // Content
        React.createElement("div", { style: { maxWidth: 700, margin: "0 auto", padding: "16px 12px 0" } },
          view === "track" ? (
            players.length === 0
              ? React.createElement(Empty, { text: 'TAP "ROSTER" TO ADD PLAYERS' })
              : React.createElement("div", null,
                  React.createElement("div", { style: { display: "flex", gap: 6, marginBottom: 14, alignItems: "center" } },
                    React.createElement("span", { style: { fontFamily: "'Bebas Neue',sans-serif", fontSize: 10, letterSpacing: 2, color: "rgba(255,255,255,0.3)", marginRight: 2 } }, "SET"),
                    ...SETS.map(n => React.createElement("button", {
                      key: n,
                      onClick: () => setCurrentSet(n),
                      style: { width: 38, height: 34, background: currentSet === n ? ACCENT : "rgba(255,255,255,0.06)", border: "1px solid " + (currentSet === n ? ACCENT : "rgba(255,255,255,0.12)"), borderRadius: 7, color: currentSet === n ? "#1a1a2e" : "rgba(255,255,255,0.45)", fontFamily: "'Bebas Neue',sans-serif", fontSize: 16 }
                    }, n)),
                    hasData ? React.createElement("button", {
                      onClick: resetCurrent,
                      style: { marginLeft: "auto", background: "transparent", border: "1px solid rgba(230,57,70,0.3)", borderRadius: 7, color: "rgba(230,57,70,0.55)", fontSize: 11, padding: "5px 10px", fontFamily: "'DM Sans',sans-serif" }
                    }, "Reset") : null
                  ),
                  React.createElement(QuickLog, { players, currentSet, onLog: handleLog, onUndo: handleUndo, lastAction })
                )
          ) : null,
          view === "summary" ? (
            players.length === 0
              ? React.createElement(Empty, { text: "NO PLAYERS YET" })
              : React.createElement(GameSummary, { players })
          ) : null,
          view === "season" ? React.createElement(SeasonView, { games }) : null,
          view === "games" ? React.createElement(GamesLog, { games, onSelect: setSelectedGame }) : null
        )
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  })();
  </script>
</body>
</html>
